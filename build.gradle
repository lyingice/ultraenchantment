plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // mods {} 必须先于 runs {} 求值：data run 需要立即 getByName 拿到 ModModel 句柄。
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            // 1) DatagenModLoader.begin(mods,...) 的 mods 集合来自 dev launch handler 解析的
            //    --mod 程序参数。缺它时 mods=[]，DataGenerator.shouldExecute=false，
            //    所有 provider 被静默丢弃（"All providers took: 0 ms"、无任何产出）。
            programArgument '--mod'
            programArgument "${mod_id}"

            // 2) 输出目录：data() 默认 --gameDir 指向 run/，产物会落在 run/generated。
            //    改为项目根，使其落在 src/generated/resources（build.gradle 已挂为资源源集）。
            programArgument '--output'
            programArgument file('src/generated/resources').absolutePath

            loadedMods.set([mods.getByName("${mod_id}")])
        }
    }
}

// ── JEI ────────────────────────────────────────────────────────────────
// 只用于开发与兼容：compileOnly 拿到 API，runtimeOnly 装完整版（跑 client 时可见）。
// 两者都不进 jar——正式环境里 JEI 可有可无，插件的发现由 JEI 自己扫描 @JeiPlugin。
repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// ── 提示框渲染栈：传说提示框 + Iceberg + Prism ───────────────────────────
// 三者都不在公共 maven 上（CurseForge / Modrinth 专有），所以放 libs/ 本地 jar：
//   compileOnly → 编译期拿 API，绝不进 jar；玩家漏装也不构成运行前提
//   runtimeOnly → 只让开发环境能真正加载它们，方便联调
// 当前联调版本（1.21.1 / NeoForge）：
//   legendarytooltips 1.5.5 · iceberg 1.3.2 · prism 1.0.11
//   ⚠️ libs/ 只是开发用；升级时替换同名前缀的 jar 即可（fileTree 按前缀匹配）。
// ⚠️ 任何 import 对方类的代码，都必须放在「确认对方已安装」之后才被加载的类里，
//    否则未安装时 JVM 会抛 NoClassDefFoundError（见 AGENT.md P0-16 / P1-40）。
def tooltipStack = fileTree(dir: 'libs', include: [
        'legendarytooltips-*.jar',
        'iceberg-*.jar',
        'prism-*.jar',
])

dependencies {
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    compileOnly tooltipStack
    runtimeOnly tooltipStack
}

// runData 输出挂进资源源集，随 jar 打包（勿手动改 generated 文件）。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 只在 neoforge.mods.toml 上做占位符展开，其它资源文件原样复制。
// 注意：expand 底层是 Groovy 模板引擎，会把它看到的任何“美元号+花括号”片段
// 当作表达式求值——资源文件里出现非占位符的该类写法会让构建以模板解析失败报错。
processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
