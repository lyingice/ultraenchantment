org.gradle.jvmargs=-Xmx2G

# Minecraft / NeoForge (both values must target the same MC version)
minecraft_version=1.21.1
neo_version=21.1.249

# JEI（仅开发期：compileOnly 用 API、runtimeOnly 装完整版；不打包进 jar）
jei_version=19.57.0.450

# ── 神化（Apotheosis）兼容 ────────────────────────────────────────────────
# 坐标来自神化官方文档：group 固定 dev.shadowsoffire，artifact 首字母大写。
# 版本号格式固定为 "<mcVersion>-<modVersion>"（见官方 Gradle 片段）。
#
# 神化的传递依赖（Curios / Patchouli）不在 Shadows' Maven 上，走 Modrinth Maven：
#   group = maven.modrinth，artifact = 项目 slug，版本 = Modrinth 上的版本号。
#   ⚠️ 注意 group 是 maven.modrinth 而不是 com.modrinth（官方文档只写了 slug，没写 group）。
apotheosis_version=1.21.1-8.9.0
apothic_enchanting_version=1.21.1-1.6.2
placebo_version=1.21.1-9.9.2
apothic_attributes_version=1.21.1-2.11.0
apothic_spawners_version=1.21.1-1.4.0

# 神化的前置（只存在于 Modrinth Maven）
patchouli_version=1.21.1-92-neoforge
curios_version=9.5.1+1.21.1

# Gateways to Eternity（modId = gateways）。
# ⚠️ 神化把 gateways 声明为 **optional**，但它的 datagen 类 import 了
# dev.shadowsoffire.gateways.*，缺了它 runData 会直接
# NoClassDefFoundError: dev/shadowsoffire/gateways/gate/Reward（神化自己的问题，不是我们的）。
# 神化要求版本 [5.1.0,)，故取 1.21.1-5.1.0。
gateways_version=1.21.1-5.1.0

# Dependency ranges used by neoforge.mods.toml
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)

# Mod metadata (mod_id must match the @Mod annotation)
mod_id=ultraenchantment
mod_name=Ultra Enchantment
mod_version=0.1.0
mod_group_id=com.lyingice.ultraenchantment
mod_authors=lyingice
mod_license=MIT license
mod_description=Vertical progression for vanilla enchantments. Each vanilla enchantment advances along its own lineage and gains qualitative upgrades.

# NOTE: the MCreator-era proxy 127.0.0.1:10090 was tested and is dead (connection refused).
# Direct access to maven.neoforged.net and services.gradle.org works, so no proxy is configured.
# Keep this file ASCII-only: Java Properties are read as ISO-8859-1 and non-ASCII would be mangled.
