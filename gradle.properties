org.gradle.jvmargs=-Xmx2G

# Minecraft / NeoForge (both values must target the same MC version)
minecraft_version=1.21.1
neo_version=21.1.249

# JEI（仅开发期：compileOnly 用 API、runtimeOnly 装完整版；不打包进 jar）
jei_version=19.57.0.450

# Dependency ranges used by neoforge.mods.toml
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)

# Mod metadata (mod_id must match the @Mod annotation)
mod_id=ultraenchantment
mod_name=Ultra Enchantment
mod_version=0.1.0
mod_group_id=com.lyingice.ultraenchantment
mod_authors=lyingice
mod_license=MIT license
mod_description=Vertical progression for vanilla enchantments. Each vanilla enchantment advances along its own lineage and gains qualitative upgrades.

# NOTE: the MCreator-era proxy 127.0.0.1:10090 was tested and is dead (connection refused).
# Direct access to maven.neoforged.net and services.gradle.org works, so no proxy is configured.
# Keep this file ASCII-only: Java Properties are read as ISO-8859-1 and non-ASCII would be mangled.