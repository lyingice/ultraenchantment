org.gradle.jvmargs=-Xmx2G

# Minecraft / NeoForge (both values must target the same MC version)
minecraft_version=1.21.1
neo_version=21.1.249

# Mod metadata (mod_id must match the @Mod annotation)
mod_id=ultraenchantment
mod_name=Ultra Enchantment
mod_version=1.0-beta-3
mod_archives_name=UltraEnchantment-starlight
mod_group_id=com.lyingice.ultraenchantment
mod_authors=lyingice
mod_license=MIT license
mod_description=Lightstar: enchantments evolve along a data-driven star chart. Place an enchanted item on the Starlight Table, light the next star, and let it become another enchantment.

# Optional KubeJS integration (compile-only; players install KubeJS themselves)
kubejs_version=2101.7.2-build.381
rhino_version=2101.2.7-build.81

# Dependency ranges used by neoforge.mods.toml
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)
