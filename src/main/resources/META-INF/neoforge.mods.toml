# 1.21.1 (NeoForge 21.1.x) REQUIRES explicit modLoader / loaderVersion; license is mandatory.
# Placeholders are expanded at build time by processResources (values come from gradle.properties).
modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"
logoFile = "ue.png"

[[dependencies.${mod_id}]]
modId="neoforge"
versionRange="${neo_version_range}"
mandatory=true

[[dependencies.${mod_id}]]
modId="minecraft"
versionRange="${minecraft_version_range}"
mandatory=true

# 可选：KubeJS 联动（只加载本模组 jar 内的 kubejs.plugins.txt 插件）。
[[dependencies.${mod_id}]]
modId="kubejs"
type="optional"
versionRange="[2101.7,)"
ordering="AFTER"
side="BOTH"

# Mixin 配置：客户端附魔书封面切换（目标 ItemRenderer，仅客户端应用）。
[[mixins]]
config="${mod_id}.mixins.json"
