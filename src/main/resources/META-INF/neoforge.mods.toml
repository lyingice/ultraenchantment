# 1.21.1 (NeoForge 21.1.x) REQUIRES explicit modLoader / loaderVersion; license is mandatory.
# Placeholders are expanded at build time by processResources (values come from gradle.properties).
modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"
logoFile = "ue.png"

[[dependencies.${mod_id}]]
modId="neoforge"
versionRange="${neo_version_range}"
mandatory=true

[[dependencies.${mod_id}]]
modId="minecraft"
versionRange="${minecraft_version_range}"
mandatory=true

# ── 可选依赖：提示框渲染栈（装了就配合，不装完全不影响）───────────────────
# 必须是 optional：写成 required 会让没装它们的玩家**直接开不了游戏**。
# ordering="AFTER" 只影响加载顺序，不构成硬依赖；versionRange 下限取我们联调过的版本。
[[dependencies.${mod_id}]]
modId="legendarytooltips"
type="optional"
versionRange="[1.5,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="iceberg"
type="optional"
versionRange="[1.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="prism"
type="optional"
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

# Mixin 配置（FML 在加载期注册，见 ModFileParser.getMixinConfigs）。
# config 字段必需，指向本模组 jar 内的 mixin 配置文件路径。
[[mixins]]
config="${mod_id}.mixins.json"

# 兼容补丁单独一份配置：目标类属于**别的模组**，由插件按「对方装没装」门控，
# 没装就整个跳过（required=false：对方改名/重构时只记日志，不让玩家崩）。
[[mixins]]
config="${mod_id}.compat.mixins.json"
